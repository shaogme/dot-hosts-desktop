name: Reusable Release Workflow

on:
  workflow_call:
    inputs:
      is_nightly:
        type: boolean
        required: false
        default: false
        description: 'Whether this is a nightly release'
      version:
        type: string
        required: false
        default: ''
        description: 'Release version for manually triggered release'
      ref:
        type: string
        required: false
        default: ''
        description: 'Git commit SHA or reference to build'

env:
  CACHIX_SUBSTITUTERS: https://cache.nixos.org https://attic.xuyh0120.win/lantian
  CACHIX_PUBLIC_KEYS: cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

jobs:
  setup-hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set-hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: set-hosts
        run: echo "hosts=$(bash .github/scripts/get-hosts.sh)" >> $GITHUB_OUTPUT

  build:
    needs: setup-hosts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.setup-hosts.outputs.hosts) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = kvm big-parallel nixos-test
            substituters = ${{ env.CACHIX_SUBSTITUTERS }}
            trusted-public-keys = ${{ env.CACHIX_PUBLIC_KEYS }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Build System Image
        id: build_image
        run: |
          HOST_DIR="${{ matrix.host }}"
          HOST_NAME=$(basename "$HOST_DIR")
          echo "host_name=${HOST_NAME}" >> $GITHUB_OUTPUT

          if [[ "$HOST_DIR" == vps/* ]]; then
            echo "Building RAW Disko Image for $HOST_DIR..."
            nix-build "$HOST_DIR" \
              --option substituters "${{ env.CACHIX_SUBSTITUTERS }}" \
              --option trusted-public-keys "${{ env.CACHIX_PUBLIC_KEYS }}" \
              -o result
            echo "image_type=raw" >> $GITHUB_OUTPUT
          elif [[ "$HOST_DIR" == virtual-box/* || "$HOST_DIR" == hosts/* ]]; then
            echo "Building Auto-Installer ISO for $HOST_DIR..."
            nix-build .github/scripts/iso-builder.nix \
              --arg hostPath "./$HOST_DIR" \
              --option substituters "${{ env.CACHIX_SUBSTITUTERS }}" \
              --option trusted-public-keys "${{ env.CACHIX_PUBLIC_KEYS }}" \
              -o result
            echo "image_type=iso" >> $GITHUB_OUTPUT
          else
            echo "Unknown host directory category: $HOST_DIR"
            exit 1
          fi

      - name: Prepare and Compress Image
        id: prep
        run: |
          HOST_NAME="${{ steps.build_image.outputs.host_name }}"
          IMAGE_TYPE="${{ steps.build_image.outputs.image_type }}"
          echo "host_name=${HOST_NAME}" >> $GITHUB_OUTPUT
          MAX_SIZE=$((1900 * 1024 * 1024))

          if [ "$IMAGE_TYPE" = "raw" ]; then
            SRC_FILE=$(find -L result -name "*.raw" 2>/dev/null | head -n 1)
            if [ -z "$SRC_FILE" ] || [ ! -f "$SRC_FILE" ]; then
              echo "ERROR: Raw image output not found in result directory!"
              exit 1
            fi
            TARGET_FILE="${HOST_NAME}.raw"
            cp "$SRC_FILE" "$TARGET_FILE"

            # raw 压缩成 .tar.zst
            ARCHIVE_NAME="${HOST_NAME}.tar.zst"
            tar -I "zstd -14 -T0" -cf "$ARCHIVE_NAME" "$TARGET_FILE"
            rm -f "$TARGET_FILE"

            FILE_SIZE=$(stat -c%s "$ARCHIVE_NAME")
            if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
              echo "File $ARCHIVE_NAME size ($FILE_SIZE bytes) exceeds limit ($MAX_SIZE bytes). Splitting into 1900M parts..."
              split -b 1900M -d -a 2 "$ARCHIVE_NAME" "${ARCHIVE_NAME}.part"
              rm -f "$ARCHIVE_NAME"
            fi

          elif [ "$IMAGE_TYPE" = "iso" ]; then
            SRC_FILE=$(find -L result -name "*.iso" 2>/dev/null | head -n 1)
            if [ -z "$SRC_FILE" ] || [ ! -f "$SRC_FILE" ]; then
              echo "ERROR: ISO output not found in result directory!"
              exit 1
            fi
            TARGET_FILE="${HOST_NAME}.iso"
            cp "$SRC_FILE" "$TARGET_FILE"

            # iso 一步到位使用 1900M 分卷压缩为 .7z
            ARCHIVE_NAME="${HOST_NAME}.7z"
            7z a -v1900m -mx=6 "$ARCHIVE_NAME" "$TARGET_FILE"
            rm -f "$TARGET_FILE"

            # 若总大小未超出 1900M（仅生成 .7z.001），重命名为单个标准 .7z 文件
            if [ -f "${ARCHIVE_NAME}.001" ] && [ ! -f "${ARCHIVE_NAME}.002" ]; then
              mv "${ARCHIVE_NAME}.001" "$ARCHIVE_NAME"
            fi
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: image-${{ steps.prep.outputs.host_name }}
          path: |
            ${{ steps.prep.outputs.host_name }}.tar.zst*
            ${{ steps.prep.outputs.host_name }}.7z*
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Download Artifacts
        uses: actions/download-artifact@main
        with:
          pattern: image-*
          merge-multiple: true

      - name: Delete Existing Nightly Release
        if: inputs.is_nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          git push origin :refs/tags/nightly || true

      - name: Determine Release Metadata
        id: rel_meta
        run: |
          TARGET_REF="${{ inputs.ref || github.sha }}"
          SHORT_SHA="${TARGET_REF:0:7}"

          if [ "${{ inputs.is_nightly }}" = "true" ]; then
            TAG_NAME="nightly"
            RELEASE_NAME="Nightly Release $(date +'%Y%m%d-%H%M%S') (${SHORT_SHA})"
            IS_PRERELEASE="true"
            TITLE="Nightly System Images (Raw & ISO) Build"
          elif [ "${{ github.ref_name }}" = "pre-release" ]; then
            TAG_NAME="pre-release-latest"
            RELEASE_NAME="Pre-Release $(date +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
            IS_PRERELEASE="true"
            TITLE="System Images (Raw & ISO) Pre-Release"
          else
            VERSION="${{ inputs.version || github.ref_name }}"
            TAG_NAME="${VERSION}"
            RELEASE_NAME="Release ${VERSION} ($(date +'%Y%m%d'))"
            IS_PRERELEASE="false"
            TITLE="System Images (Raw & ISO) Release"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Generate Release Body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ steps.rel_meta.outputs.title }}" > release_body.md
          echo "" >> release_body.md
          echo "**Commit:** \`${{ inputs.ref || github.sha }}\`" >> release_body.md
          echo "**Date:** \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\`" >> release_body.md
          echo "" >> release_body.md
          echo "**Artifacts:**" >> release_body.md
          for f in *.tar.zst* *.7z*; do
            if [ -f "$f" ]; then
              echo "- \`$f\`" >> release_body.md
            fi
          done

          if ls *.part* >/dev/null 2>&1; then
            echo "" >> release_body.md
            echo "> **Note:** Files with \`.part*\` extensions were split because they exceeded GitHub's 2GB file limit." >> release_body.md
            echo "> To restore the original file: \`cat <filename>.tar.zst.part* > <filename>.tar.zst\`" >> release_body.md
          fi

          if ls *.7z.00* >/dev/null 2>&1; then
            echo "" >> release_body.md
            echo "> **Note:** Files with \`.7z.00*\` extensions were split using 7-Zip multi-volume because they exceeded GitHub's 2GB file limit." >> release_body.md
            echo "> To restore the original file: extract with 7-Zip (\`7z x <filename>.7z.001\`)." >> release_body.md
          fi

          if [ "${{ inputs.is_nightly }}" = "true" ]; then
            NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${{ steps.rel_meta.outputs.tag_name }}" \
              -f target_commitish="${{ inputs.ref || github.sha }}" \
              --jq .body 2>/dev/null || true)
            if [ -n "$NOTES" ]; then
              echo "" >> release_body.md
              echo "<details>" >> release_body.md
              echo "<summary>Commits</summary>" >> release_body.md
              echo "" >> release_body.md
              echo "$NOTES" >> release_body.md
              echo "" >> release_body.md
              echo "</details>" >> release_body.md
            fi
          fi

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.rel_meta.outputs.tag_name }}"
          RELEASE_NAME="${{ steps.rel_meta.outputs.release_name }}"
          TARGET_REF="${{ inputs.ref || github.sha }}"
          IS_PRERELEASE="${{ steps.rel_meta.outputs.is_prerelease }}"
          IS_NIGHTLY="${{ inputs.is_nightly }}"

          CREATE_FLAGS=()
          [ "$IS_PRERELEASE" = "true" ] && CREATE_FLAGS+=(--prerelease)
          [ "$IS_NIGHTLY" != "true" ] && CREATE_FLAGS+=(--generate-notes)

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, editing metadata..."
            EDIT_FLAGS=()
            [ "$IS_PRERELEASE" = "true" ] && EDIT_FLAGS+=(--prerelease)
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes-file release_body.md \
              --target "$TARGET_REF" \
              "${EDIT_FLAGS[@]}"
          else
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes-file release_body.md \
              --target "$TARGET_REF" \
              "${CREATE_FLAGS[@]}"
          fi

      - name: Upload Release Assets in Batches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.rel_meta.outputs.tag_name }}"
          BATCH_SIZE=3

          # 收集所有符合规则的产物文件
          mapfile -t FILES < <(find . -maxdepth 1 -type f \( -name "*.tar.zst" -o -name "*.tar.zst.part*" -o -name "*.7z" -o -name "*.7z.*" \) -printf "%f\n" | sort -u)

          TOTAL_FILES=${#FILES[@]}
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "Warning: No release asset files found to upload."
            exit 0
          fi

          echo "Found $TOTAL_FILES asset file(s) to upload:"
          for f in "${FILES[@]}"; do
            echo "  - $f ($(du -h "$f" | cut -f1))"
          done

          upload_file() {
            local file="$1"
            local max_retries=3
            local attempt=1
            local delay=5

            while [ "$attempt" -le "$max_retries" ]; do
              echo "[$(date -u +'%H:%M:%S')] Uploading $file (Attempt $attempt/$max_retries)..."
              if gh release upload "$TAG_NAME" "$file" --clobber; then
                echo "[$(date -u +'%H:%M:%S')] Successfully uploaded: $file"
                return 0
              else
                echo "[$(date -u +'%H:%M:%S')] Warning: Upload failed for $file (Attempt $attempt/$max_retries)"
                if [ "$attempt" -lt "$max_retries" ]; then
                  sleep "$delay"
                  delay=$((delay * 2))
                fi
                attempt=$((attempt + 1))
              fi
            done

            echo "[$(date -u +'%H:%M:%S')] ERROR: Failed to upload $file after $max_retries attempts."
            return 1
          }

          TOTAL_BATCHES=$(( (TOTAL_FILES + BATCH_SIZE - 1) / BATCH_SIZE ))

          for ((i=0; i<TOTAL_FILES; i+=BATCH_SIZE)); do
            batch=("${FILES[@]:i:BATCH_SIZE}")
            BATCH_NUM=$(( (i / BATCH_SIZE) + 1 ))

            echo "=========================================="
            echo "Starting Batch $BATCH_NUM / $TOTAL_BATCHES (${#batch[@]} files concurrently)"
            echo "=========================================="

            pids=()
            for file in "${batch[@]}"; do
              upload_file "$file" &
              pids+=($!)
            done

            failed=0
            for pid in "${pids[@]}"; do
              if ! wait "$pid"; then
                failed=1
              fi
            done

            if [ "$failed" -ne 0 ]; then
              echo "ERROR: Batch $BATCH_NUM upload failed!"
              exit 1
            fi

            echo "Batch $BATCH_NUM completed successfully."
          done

          echo "All release assets uploaded successfully."
